# Free trial: sleeps on idle; local jobs and results are temporary.
services:
  - type: web
    name: voc-to-mrd
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: VOC_APP_MODE
        value: cloud
      - key: VOC_RESEARCH_BACKEND
        value: deepseek
      - key: VOC_RUNS_DIR
        value: /data/research-runs
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: VOC_COLLECTOR
        value: v2ex
      - key: VOC_SESSION_SECRET
        generateValue: true
      - key: VOC_ACCESS_CODES
        generateValue: true
      - key: VOC_USER_DAILY_LIMIT
        value: '3'
      - key: VOC_GLOBAL_DAILY_LIMIT
        value: '10'
