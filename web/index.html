/* A real research query field, with the browser's native blinking caret. */
.hero-bubble{display:flex;align-items:center;min-height:clamp(100px,9.6vw,190px)}
.hero-query{width:100%;border:0;background:transparent;color:#626572;caret-color:#777b89;font:400 clamp(20px,2vw,34px)/1.5 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.02em;text-align:center;outline:none;min-width:0;padding:0}
.hero-query::placeholder{color:#b0b1b8;opacity:1}
.hero-query:focus{text-align:center}
/* The gradient travels around a stationary capsule when focused. */
@property --research-ring-angle{syntax:"<angle>";inherits:false;initial-value:0deg}
.hero-bubble{transition:filter .35s ease;isolation:isolate}
.hero-bubble:before{content:"";position:absolute;inset:-3px;padding:3px;border-radius:inherit;background:conic-gradient(from var(--research-ring-angle),#477dff 0deg,#36bbef 70deg,#35ce91 145deg,#ffda45 215deg,#ff7b65 275deg,#b473f0 325deg,#477dff 360deg);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none;opacity:0;transition:opacity .3s ease;filter:drop-shadow(0 0 9px #a29cff99)}
.hero-bubble:focus-within{outline:none;filter:drop-shadow(0 0 15px #ffffff66) drop-shadow(0 0 32px #a9b5ea44)}
.hero-bubble:focus-within:before{opacity:1;animation:research-ring-orbit 4s linear infinite}
@keyframes research-ring-orbit{to{--research-ring-angle:360deg}}
/* Keep the search focus ring inside the field's existing bounds. */
.toolbar{position:relative;border-radius:35px}
.toolbar #search{display:block}
.toolbar #search:focus,.toolbar #search:focus-visible{outline:none;border-color:transparent}
.toolbar:after{content:"";position:absolute;inset:0;padding:2px;border-radius:inherit;background:conic-gradient(from var(--research-ring-angle),#477dff 0deg,#36bbef 70deg,#35ce91 145deg,#ffda45 215deg,#ff7b65 275deg,#b473f0 325deg,#477dff 360deg);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none;opacity:0;transition:opacity .25s ease}
.toolbar:focus-within:after{opacity:1;animation:research-ring-orbit 4s linear infinite}

.hero-query-field{display:grid;grid-template-columns:minmax(0,1fr);width:100%;align-items:center;position:relative;font-family:Georgia,"Songti SC","STSong",serif;font-size:clamp(28px,3vw,58px);font-weight:400;line-height:1.35;letter-spacing:-.04em}

T1但提供T3次主题证据，不重复计入主主题分母。 支撑ID：GWC01,S07-R075,S06-R010。\n\n验收标准：最终导航目的地正确率与导航任务完成率在同车型、精确OTA版本的地点别名、同名候选与回家指令用例内达到待定目标；目标值待定，以该版本基线实测及下一步验证确定，并以目的地核对、澄清路径和独立导航状态回读回归。\n\n> 语音助手差点，一般用来导航、听歌、开关窗、开关空调等导航地点很多不识别，这个强烈建议尽快升级！\n\n— GWC01｜汽车之家｜2024-07-15｜[来源](https://club.autohome.com.cn/bbs/thread/9415a8232d071180/108695456-1.html)\n\n### P1 · 唤醒体验的可控性与设置支持\n\n将唤醒误触发/权限控制与唤醒设置支持归为一个工作组。按“影响 × 置信度”作定性排序，不计算虚构分数：具体干扰与权限自述且有反向证据的项先验证；依赖同一视频、缺车型/版本的问题线索后验证。设置支持材料仍属于T4主主题、T1次主题，不挪动主题计数。\n\n#### P1 · 减少误触发并尊重音区权限\n\n用途：迭代。依据：有2条非预期打扰自述，也有设置有效的反向证据；未证明安全漏洞，不自动升级P0。 支撑ID：EX07,GWC02,EX10。\n\n组内顺序：先验证。影响是非预期打扰和权限预期失效；证据为中，有EX10设置有效的反向证据，原因未核实，未证明安全漏洞。\n\n验收标准：非指令对话误触发次数及音区设置与实际响应的一致性在同车型、精确OTA版本的车内聊天、儿童移向前排、车外呼叫及配置状态用例内达到待定目标；目标值待定，以该版本基线实测确定，并以配置前后对照、实际触发记录与独立状态回读回归；不据此预先认定安全漏洞。\n\n> 在车里和别人说话，小欧自己启动语音识别\n\n— EX07｜汽车之家｜2019-08-19｜[来源](https://club.m.autohome.com.cn/bbs/thread-c-4826-82711907-1.html?type=Jing)\n\n#### P1 · 说明车型支持与唤醒设置路径\n\n用途：迭代。依据：同视频两条设置问题与疑问，先核查支持范围，不能当跨源故障确认。 支撑ID：BILI022,BILI023。\n\n组内顺序：后验证。影响是设置疑问/受阻线索，尚不能判定实际故障；证据为低，依赖同一视频语境，先回访车型、版本和操作过程。\n\n验收标准：支持范围说明与实际功能的一致性、用户按说明完成设置的比例在已核实车型和精确OTA版本的唤醒设置任务内达到待定目标；目标值待定，以支持清单核验、基线任务测试及下一步回访确定，并以车型/版本/操作过程复核和设置后状态回读回归；两条同视频评论仍不能视为跨源确认。\n\n> 我的改不了，不知道为啥，\n\n— BILI022｜B站｜2024-11-12｜[来源](https://www.bilibili.com/video/BV1Q24y1W7B7)\n\n### P1 · 支持自然说法、连续指令与及时反馈\n\n用途：迭代。依据：11条中9条正面、2条负面；保留已有价值，验证说法覆盖与等待，不能称11条都抱怨执行。 支撑ID：EX06,EX01,GWC04,EX03。\n\n验收标准：自然表达及连续指令任务完成率、端到端等待时间在同车型、精确OTA版本的既有车控任务用例内达到待定目标；目标值待定，以该版本基线实测确定，并以固定格式/非完整说法、单指令/连续指令对照及最终车辆状态回读回归；原文“1、2秒”仅为自述，不用作验收阈值。\n\n> 如果说出的指令格式不正确或不完整，车机识别出来的错误率就很高。\n\n— EX06｜汽车之家｜2019-08-18｜[来源](https://club.m.autohome.com.cn/bbs/thread-c-4826-82711907-1.html?type=Jing)\n\n### P1 · 保留快捷入口和失败补救\n\n用途：迭代。依据：用户偏好不同；低头负担是自述，语音安全收益未实测；不强制用语音。 支撑ID：S01-R126,S01-R177,S01-R035,S06-R010。\n\n验收标准：替代入口可达性、失败后任务完成率及完成时间在同车型、精确OTA版本的导航、风速操作与手机地址推送任务内达到待定目标；目标值待定，以现有入口基线实测及下一步任务测试确定，并以语音失败后的快捷入口、物理操作或手机推送路径和最终任务状态回读回归；低头负担与安全收益仍需实测，不强制使用语音。\n\n> 可以有语音控制，但我很难接受只能语音或触屏（特别是还藏得很深）控制\n\n— S01-R126｜V2EX｜2023-12-28｜[来源](https://www.v2ex.com/t/1004012)\n\n### P2 · 澄清语音服务权益和续费规则\n\n用途：迭代。依据：只有1条旧收费争议，作为核查线索；不推导付费意愿或订阅价格。 支撑ID：EX05。\n\n> 现在却要续费使用，收费不合理\n\n— EX05｜车质网｜2022-11-05｜[来源](https://m.12365auto.com/zlts/20221105/839495.shtml)\n\n### P2 · 探索跨端任务协作\n\n用途：机会假设。依据：已有跨端路径自述；先访谈与任务测试，暂不优先建设跨服务编排、主动服务或记忆。 支撑ID：S02-R014,S06-R010。\n\n> 那可能我习惯了下班路上喊 siri 给老婆打电话，觉得无线 carplay 挺方便的。周末出去玩回家的路上，也会提前喊 siri 或者按方向盘的语音键（也是唤醒 siri ）让他帮我把家里空调什么的都打开\n\n— S02-R014｜V2EX｜2025-08-06｜[来源](https://www.v2ex.com/t/1150268)\n\n## 4. 范围与非目标\n\n本MRD可支撑的决策 = 座舱语音助手迭代方向的候选清单。不可支撑 = 商业立项结论（市场规模、付费意愿、单位经济需另行验证）。决策目标继续兼顾助手迭代与新Agent机会，但机会只保留为待验证假设。\n\n- 本轮候选范围：稳定唤醒、导航目标正确理解与任务完成、误触发与音区权限、唤醒设置支持、自然连续交互、快捷入口和失败补救；服务权益争议作为低置信度核查线索。\n- 跨端协作仅开展具体任务访谈和验证，不直接建设跨服务编排、主动服务或长期记忆；这三项是本轮非目标。传统车控多指令不能直接证明这些需求。\n- 不输出当前最新Agent整体表现、故障率、安全收益、需求覆盖率、品牌排名或留存结论；不把设置疑问认定为可复现故障，不把缺失市场/商业证据补成正式立项判断。\n- 本次是旧探索性v1的评审修订，沿用原文四部分逻辑并插入范围节；不新增市场分析事实，不编写BRD或PRD。后续11部分MRD结构用于新研究，本轮不借扩写增加未经验证的结论。\n\n## 5. 竞品格局\n\n比较对象随用户任务选择；以下能力与不足均为本批评论中的自述，不是当前官方规格、统一测评或品牌排名。传统车控多指令不能直接证明跨服务Agent、主动服务或长期记忆需求。\n\n|现有方案|本批反馈体现的价值|不足或未知|原声证据|\n|---|---|---|---|\n|长城/魏牌等原生语音助手|自然车控、连续指令、第三排唤醒|部分用户抱怨漏唤醒、地点不识别；车型年份混合，不代表最新版本|GWC04、EX03、GWC03；GWC05、GWC01|\n|Siri / CarPlay|电话及回家前家庭设备控制的既有路径|另一评论者自述高德语音入口受限，无法推广到所有版本|S02-R014、S02-R091|\n|阿维塔 / 问界语音助手|试驾者肯定多音区与连续表达|本批无具体负面体验，无法判断弱点和品牌差距|S01-R127|\n|特斯拉原生语音及车机|用户讨论语音控制与易用性|泛化难用及比较意见，缺具体任务、版本和对照条件|S05-R132、S05-R133|\n|物理按键、快捷入口、手机地址推送|即时操作、预设路线与语音失败后的补救|手动查找风速入口负担；其他路径的完成效率未实测|S01-R177、S01-R035、S06-R010|\n\n竞品原声：\n\n> 那可能我习惯了下班路上喊 siri 给老婆打电话，觉得无线 carplay 挺方便的。周末出去玩回家的路上，也会提前喊 siri 或者按方向盘的语音键（也是唤醒 siri ）让他帮我把家里空调什么的都打开\n\n— S02-R014｜V2EX｜2025-08-06｜[来源](https://www.v2ex.com/t/1150268)\n\n> 用过车机导航后就没用 CarPlay 了，车机导航语音很方便，CarPlay 不能用语音控制高德\n\n— S02-R091｜V2EX｜2025-08-06｜[来源](https://www.v2ex.com/t/1150268)\n\n> 很多人对过去车机智障一样的表现都 PTSD 了\n> 直到我去试驾了阿维塔和问界，那个语音识别感受真实太好了\n> 完全可以当成自己跟屁虫的感觉\n> 可以智能识别主驾，后座，副驾多个方位，可以连续说\n> 跟过去那种智障语音助手完全不一样\n\n— S01-R127｜V2EX｜2023-12-28｜[来源](https://www.v2ex.com/t/1004012)\n\n> 语音助手、导航、地图也是有点难用\n\n— S05-R132｜V2EX｜2024-10-24｜[来源](https://www.v2ex.com/t/1082891)\n\n> 物理按键，你按到即命令执行\n> 而语音都要有一个等待回馈的过程\n> 我并不觉得这种等待回馈的过程让人舒适和安全\n\n— S01-R177｜V2EX｜2023-12-29｜[来源](https://www.v2ex.com/t/1004012)\n\n机会窗口（产品假设）：优先在稳定唤醒、目的地正确理解、失败补救和入口选择上提高任务完成质量；保留已有自然连续交互的价值。跨端协作可从电话、地址推送等具体任务探索，而非直接建设全能Agent。\n\n下一步验证：补足同车型精确OTA版本；用同任务检查输入、澄清、执行和独立状态回读；访谈泛化负评与设置疑问；测试用户是否实际需要跨端编排。若问题仅存在于旧版本，或现有快捷入口已满足需求，相应机会与优先级须下调。市场规模、付费意愿、采购需求、留存和单位经济留待另行验证，本MRD不支持直接作商业立项结论。\n\n## 6. 下次更新触发条件\n\n补足同车型精确OTA版本及可回读的同任务基线后更新下一版；或完成第二标注员一致性检验、缺失日期/来源复核、设置疑问回访、跨端任务测试后，修订受影响结论。没有新验证就不把目标值“待定”改为承诺值。若问题只存在于旧版本，或现有快捷入口已满足需求，相应机会与优先级须下调。\n\n市场规模、付费意愿、采购需求、留存和单位经济必须另行验证；本MRD仍不支持直接作商业立项结论。\n\n## 7. 本次修改对照表\n\n|附件编号|本次修改|位置及核验结果|\n|---|---|---|\n|改1|将重复的数据质量正文压缩为数据可信度摘要表，保留来源、时间、版本、留评偏差与未独立验证边界。|第1节；完整方法引用2.md。|\n|改2|为全部P0/P1条目补“指标—范围—目标待定—验证方式”，不新增数值目标。|第3节；同一P1组的两个子项分别有验收标准，均待基线验证。|\n|改3|唤醒依据改为与所列3个ID一致；补GWC05、EX07、S07-R075及其导航补充引文、BILI023。|第2节均可找到第3节所有支撑ID的原声；补录来源是数据报告列明的本地标注文件，逐字核对，不新增样本、未联网回查。|\n|改4|集中写范围与非目标，暂不建设跨服务编排、主动服务和长期记忆。|新增第4节；原竞品格局顺延为第5节。|\n|改5|P1误触发/权限与设置路径合为唤醒体验工作组，按影响与置信度定性先后排序；用途统一为迭代/机会假设。|第3节；不改变设置反馈的T4主主题归属。自然连续交互按既有能力迭代归类，跨端探索保留机会假设。|\n|改6|原T5收费仅列“其他线索”；四个主要簇置信度合为图例；增加更新触发条件并明确文件版本。|第2、6节；docs/02-MRD.md为原v1，docs/02-MRD_v2.md为本次v2，2.md是本轮数据报告副本。|\n|数据报告|只在顶部加执行摘要，原正文逐字保留；版本映射放在摘要中。|docs/01l-用户之声补齐分析与数据报告.md及同内容副本docs/2.md；其原产物清单仍准确指向v1，未改正文。|\n\n引文核验说明：原MRD所有已展示引文、来源URL和日期保留原字。附件指定的两份正文没有GWC05、S07-R075导航补充引文和BILI023全文；本次补录仅回读数据报告“产物”列出的41条本地标注CSV及其既有保存原文，不引入新数据或联网结果。单条原声及所有解释仍属于公开自述、需求线索或分析推断，未独立验证。\n\n### 本地补录核验索引\n\n|ID|补录位置|实际核验材料|处理边界|\n|---|---|---|---|\n|EX07|T1引文区|原v1第3节已有同字引文；data/voc_enriched_annotations_20261007.csv，第8行|只补第2节索引，不新增原声。|\n|GWC05|T1引文区|data/voc_enriched_annotations_20261007.csv，第21行；docs/01b-长城魏牌用户评价补充.md|本地保存引文补录，2022-05-10及原URL原样保留；未联网回查、未核实故障根因。|\n|S07-R075|T3次主题引文区|data/voc_enriched_annotations_20261007.csv，第67行起；data/verified_quotes.csv；docs/01-数据分析报告.md|主引文与导航补充引文原样保留，2026-05-14及原URL不改；主主题仍T1、不重复计数。|\n|BILI023|T4引文区|data/voc_enriched_annotations_20261007.csv，第26行；docs/01g-B站座舱用户反馈采集.md|本地保存的设置疑问补录，2023-02-12及原URL不改；同视频语境、证据低，未独立验证。|\n", "conclusions": [{"title": "优先保证唤醒与导航任务完成", "text": "先验证需要时能唤醒、目的地能正确理解，并提供失败后的澄清与补救。", "evidence_ids": "EX04,GWC05,EX17,GWC01,S07-R075,S06-R010"}, {"title": "保留自然表达与连续交互的已有价值", "text": "本批相关主题既有肯定，也有格式依赖和等待问题；改进表达覆盖与反馈速度，保留已经被认可的体验。", "evidence_ids": "GWC04,EX03,EX06,EX01"}, {"title": "给用户操作选择，并核实音区与设置问题", "text": "语音、快捷入口和手机补救各有适用场景；误触发、音区权限、车型支持与设置路径需要分别核实。", "evidence_ids": "S01-R126,S01-R177,S01-R035,GWC02,EX10,BILI022,BILI023"}, {"title": "跨端 Agent 协作先从具体任务验证", "text": "先证明跨端任务比现有手机推送与 Siri 更省操作，再决定是否投入；本轮不据此确定复杂编排或付费方案。", "evidence_ids": "S02-R014,S06-R010,EX05"}], "report_filename": "用户之声数据分析报告.md", "mrd_filename": "02-MRD_v2.md"}</script><script id="audit-data" type="application/json">[{"source_id": "N01", "url": "https://k.autohome.com.cn/detail/view_01kw6bva9y6mw3echh70wg0000.html", "status": "正文与引文匹配", "decision": "纳入", "sample_ids": "EX01"}, {"source_id": "N02", "url": "https://k.autohome.com.cn/detail/view_01kk1ejhns6mw30e1n60t00000.html", "status": "正文与引文匹配", "decision": "纳入", "sample_ids": "EX02"}, {"source_id": "N03", "url": "https://club.autohome.com.cn/bbs/thread/c3438470adeb7a85/106722317-1.html", "status": "正文与引文匹配", "decision": "纳入", "sample_ids": "EX03"}, {"source_id": "N04", "url": "https://www.12365auto.com/zlts/20200108/441734.shtml", "status": "正文与引文匹配", "decision": "纳入", "sample_ids": "EX04"}, {"source_id": "N05", "url": "https://m.12365auto.com/zlts/20221105/839495.shtml", "status": "正文与引文匹配", "decision": "纳入", "sample_ids": "EX05"}, {"source_id": "N06", "url": "https://club.m.autohome.com.cn/bbs/thread-c-4826-82711907-1.html?type=Jing", "status": "正文与引文匹配", "decision": "纳入", "sample_ids": "EX06;EX07"}, {"source_id": "N07", "url": "https://www.12365auto.com/review/2974_0_0_1.shtml", "status": "正文与引文匹配", "decision": "纳入", "sample_ids": "EX08"}, {"source_id": "N08", "url": "https://club.autohome.com.cn/bbs/thread/c8d31652f101ae14/84645251-1.html", "st nal_quote": "", "limitations": "继承首轮语义筛选，只展示17条核心自述，不把917条回复都当助手评价；混合车型与年份，不能代表总体车主。", "live_recheck": "本轮未联网回查"}, {"sample_id": "S05-R133", "platform": "V2EX", "brand": "品牌未核实", "model": "车型未核实（综合车机讨论）", "published_at": "2024-10-24", "software_version": "未披露", "quote": "我看很少有人真正去对比车与车之前的产品力，功能性，驾驶感受怎么样。\r\n\r\n对于特斯拉来说评价都是很极端的，认为他好的，其他车就完全不行。认为他不好的，觉得特斯拉就是个韭菜车。\r\n\r\n作为大家最常说到的特斯拉的三电比较好，一般会提到特斯拉电门没有延迟，电控好电耗低。\r\n\r\n1. 电门没有延迟确实是一个很鲜明的特点，喜欢的人很在意这点，这能更好的人车合一。但大家很多之前都开过其他车，这个转变其实也有很多人不是很适应的，而且对于舒适感来说是大大减分的，特别是乘客。很多国产车都会对电门进行特殊调教，电门并不是线性加速的，还是加入了很多舒适性的考虑。\r\n\r\n2. 特斯拉电耗低，这确实非常棒。特斯拉能做到这一点，最主要靠两点。一个是车身重量，除了特斯拉的一些简化设计带来的减重以外，最大的减重来源于电池，特斯拉标配 60 度电池，比一般国产车多电池至少轻 200 斤。第二个就是动能回收，特斯拉的动能回收是强制开启的，特斯拉在动能回收上下了很多功夫，体验也比别的电车要好。但这也非常考验驾驶者的技术，如果电门控制不当就有会有急刹的感觉，我在使用早期作为驾驶者都会有晕车的感觉。\r\n\r\n3. 除了上述两点是我们在日常使用这个产品本身的过程中，给我们带来的两个很直观的感受。其他大家认为应该选择特斯拉都是说的其他方面，包括不限于：知名度，品牌价值，售后服务好，销售不搞套路，还有人帮维权（没搞懂），保值，性价比高（这个我不理解为什么这么说）。这些大部分是值产品背后的一些附加因素。\r\n\r\n最后我个人认为特斯拉对比国产车，智能化程度比较低（语音不是很好），车机不算太好用（不是很符合国人的习惯），导航不好使（我看大部分特斯拉车主都习惯用手机导航），辅助驾驶比较一般（特别是自动泊车，车道保持还可以），内饰过于简单，坐着没那么舒服。\r\n对比我自己现在开的电车，我坐着车里体验就很舒服，有香氛系统，有分区空调，有防疲劳检测，会自动调整座椅方向盘，有座椅通风按摩，会有比较多的场景模式自动触发，百分之 80 的功能都可以语音操作，驾驶体验更舒适，加速刹车都比较柔和。", "source_url": "https://www.v2ex.com/t/1082891", "source_title": "为什么很多人买电车都选择特斯拉", "relevance": "相关", "relevance_reason": "明确针对语音控制/唤醒/理解/连续指令/使用负担/语音服务提出评价或需求", "display_quote": "最后我个人认为特斯拉对比国产车，智能化程度比较低（语音不是很好）", "sentiment": "混合", "scope": "核心助手", "batch": "V2EX首轮核心反馈", "identity_status": "身份未核实；公开使用自述", "theme": "行驶中减少视觉与手动操作", "usage_scene": "自述电车体验对比", "pain_point": "语音体验不佳，同时肯定控制覆盖", "task_impact": "信息不足", "evidence_strength": "低", "evidence_basis": "泛化评价、偏好、收费片段或依赖上下文的疑问；只能支持态度或问题线索", "user_job": "用语音控制车内功能", "desired_outcome_inferred": "提高可控覆盖及易用性", "primary_theme": "T4", "additional_quote": "百分之 80 的功能都可以语音操作", "limitations": "继承首轮语义筛选，只展示17条核心自述，不把917条回复都当助手评价；混合车型与年份，不能代表总体车主。", "live_recheck": "本轮未联网回查"}, {"sample_id": "S06-R010", "platform": "V2EX", "brand": "品牌未核实", "model": "车型未核实（综合车机讨论）", "publi  $('list').hidden=currentView!=='voices';$('insights').hidden=currentView!=='insights';$('reports').hidden=currentView!=='reports';
 for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===currentView));
 $('list').innerHTML=filtered.length?filtered.map(r=>`<article class="review" data-id="${esc(r.sample_id)}"><div class="topline"><span class="id">${esc(r.sample_id)} · ${esc(r.platform)}</span><span class="sentiment ${r.sentiment==='负面'?'negative':''}">${esc(r.sentiment)}</span></div><strong>${esc(r.theme)}</strong><blockquote>“${esc(r.display_quote||r.quote)}”</blockquote><p class="review-meta">${esc(r.model)} · ${esc(r.published_at||'日期未获取')}<br>${esc(r.identity_status)}</p><details class="card-evidence"><summary>查看分析与证据</summary><p>场景：${esc(r.usage_scene||'未标注')}</p><p>痛点：${esc(r.pain_point||'未标注')}</p><p>任务影响：${esc(r.task_impact||'信息不足')}</p><p>期望结果（分析推断）：${esc(r.desired_outcome_inferred||'未知')}</p><p>证据强度：${esc(r.evidence_strength||'未标注')} · ${esc(r.evidence_basis)}</p><p>主题审核：${esc(r.relevance_reason)}</p><p>软件版本：${esc(r.software_version||'未披露')}</p><p>证据局限：${esc(r.limitations)}</p></details><a href="${esc(r.source_url)}" target="_blank" rel="noopener noreferrer">${esc(r.platform)} · 查看来源 ↗</a></article>`).join(''):`<div class="empty"><strong>当前筛选下没有匹配反馈</strong><p>正在筛选${esc($('platform').value||'全部渠道')}的已采集数据${q?'，关键词「'+esc($('search').value.trim())+'」':''}。此输入框不会发起联网搜索或新采集。</p>${searchMatches.length?`<p>全部渠道中，${q?'该关键词':'现有数据'}有 ${searchMatches.length} 条相关反馈。${esc([...new Set(searchMatches.map(r=>r.platform))].join('、'))}</p><button class="button" id="search-all-channels">保留关键词，查看全部渠道</button>`:'<p>现有相关反馈中没有该关键词。请换一个词或清空搜索；新内容需要另行采集。</p>'}</div>`;
}
$('list').addEventListener('click',e=>{if(e.target.closest('#search-all-channels')){for(const id of filterIds)$(id).value='';render()}});
function insightSummary(filtered){
 const all=filtered.length===eligible.length;
 return `<section class="ai-summary"><div class="eyebrow">AI 洞察总结</div><h2>${all?esc(summary.heading):'当前筛选的证据概览'}</h2><p>${all?esc(summary.text):'下列洞察继承整批分析，仅展开当前筛选命中的原声。'}</p><p>当前筛选 ${filtered.length} 条 · 正面 ${filtered.filter(r=>r.sentiment==='正面').length} 条 · 负面 ${filtered.filter(r=>r.sentiment==='负面').length} 条 · 任务阻断自述 ${filtered.filter(r=>r.task_impact==='任务阻断').length} 条</p></section>`;
}
function renderInsights(filtered){
 const shown=new Set(filtered.map(r=>r.sample_id));
 const cards=needs.map(n=>{const evidence=n.evidence_ids.split(',').map(id=>eligible.find(r=>r.sample_id===id)).filter(Boolean);const matches=evidence.filter(r=>shown.has(r.sample_id));if(!matches.length)return '';return `<article class="need-card"><div class="topline"><span class="priority" data-priority="${esc(n.priority)}">${esc(n.priority)}</span><span class="id">${esc(n.decision_type)}</span></div><h3>${esc(n.need)}</h3><div class="ai-finding"><small>AI 洞察 · 分析解释</small><p>${esc(n.insight)}</p></div><div class="ai-action"><small>建议行动 · 待验证</small><p>${esc(n.suggested_action)}</p></div><p>证据可信程度：${esc(n.confidence)}</p><details><summary>判断依据与验证方法</summary><p>${esc(n.reason)}</p><p>${esc(n.validation)}</p></details><p class="id">当前筛选匹配 ${matches.length} 条支撑记录 · 本案例支撑 ${evidence.length} 条（非主题总量）</p><details><summary>展开真实原声与依据</summary>${matches.map(r=>`<div class="need-evidence"><blockquote>“${esc(r.quote)}”</blockquote>${r.additional_quote?`<blockquote>“${esc(r.additional_quote)}”</blockquote>`:''}<p class="id">${esc(r.sample_id)} · ${esc(r.platform)} · ${esc(r.published_at||'日期未知')}</p><p>任务影响：${esc(r.task_impact)} · 证据：${esc(r.evidence_strength)}</p><a href="${esc(r.source_url)}" target="_blank" rel="noopener noreferrer">查看来源 ↗</a></div>`).join('')}</details></article>`}).join('');
 $('insights').innerHTML=insightSummary(filtered)+(cards||'<div class="empty">当前条件没有匹配的需求证据。请查看原声库或调整筛选。</div>');
}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{currentView=b.dataset.view;render()};
document.querySelector('.center-nav a[href="#voices"]').addEventListener('click',event=>{
 if(event.button>0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
 event.preventDefault();
 currentView='voices';render();
 if(location.hash!=='#voices')history.pushState(null,'','#voices');
 requestAnimationFrame(()=>{
  $('research-insights').scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
 });
});
$('nav-insights').addEventListener('click',event=>{
 event.preventDefault();
 currentView='insights';render();
 if(location.hash!=='#research-insights')history.pushState(null,'','#research-insights');
 requestAnimationFrame(()=>{
  $('research-insights').scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
 });
});
$('nav-reports').addEventListener('click',()=>{currentView='reports';render()});
if(location.hash==='#research-insights'){currentView='insights';}
if(location.hash==='#research-results'){currentView='reports';}

for(const b of document.querySelectorAll('[data-report]'))b.onclick=()=>{const kind=b.dataset.report;const u=URL.createObjectURL(new Blob([reports[kind]],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=reports[kind+'_filename']||(kind==='mrd'?'02-MRD.md':'用户之声数据分析报告.md');a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('search').addEventListener('input',render); for(const id of filterIds)for(const b of $(id).querySelectorAll('button'))b.onclick=()=>{if(id==='platform'){$('search').value='';for(const key of filterIds)if(key!=='platform')$(key).value='';selected=undefined;}$(id).value=b.dataset.value;render()};
$('download').onclick=()=>{const keys=Object.keys(rows[0]||{});const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\uFEFF'+[keys,...rows.map(r=>keys.map(k=>r[k]))].map(r=>r.map(cell).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='feedback.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
const audit=JSON.parse($('audit-data').textContent);$('audit-table').innerHTML=audit.map(r=>`<tr><td><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.source_id)} ↗</a></td><td>${esc(r.status)}</td><td>${esc(r.decision)}</td><td>${esc(r.sample_ids||'—')}</td></tr>`).join('');

const researchForm=document.getElementById('research-query-form');
const researchInput=document.getElementById('research-query');
const researchStatus=document.getElementById('research-status');
const researchTime=document.getElementById('research-time');
let researchStartedAt=0,researchClock;
function updateResearchTime(){
 if(!researchStartedAt)return;
 const elapsed=Math.max(0,Math.floor((Date.now()-researchStartedAt)/1000));
 const minutes=String(Math.floor(elapsed/60)).padStart(2,'0'),seconds=String(elapsed%60).padStart(2,'0');
 researchTime.textContent=(elapsed<900?'预计约 5–15 分钟（初步估计）':'已超过初步预估，任务仍在执行；最长等待 30 分钟')+' · 已用时 '+minutes+':'+seconds;
}

researchForm.addEventListener('submit',async event=>{
 event.preventDefault();
 const topic=researchInput.value.trim();
 if(topic.length<2){researchStatus.textContent='请输入具体的产品或研究主题';researchInput.focus();return}
 researchInput.disabled=true;researchForm.setAttribute('aria-busy','true');researchStatus.textContent='正在连接真实采集服务…';researchTime.textContent='';researchStartedAt=0;clearInterval(researchClock);
 const finish=()=>{clearInterval(researchClock);researchInput.disabled=false;researchForm.setAttribute('aria-busy','false');if(researchStartedAt){const elapsed=Math.max(0,Math.floor((Date.now()-researchStartedAt)/1000));researchTime.textContent='已用时 '+Math.floor(elapsed/60)+' 分 '+elapsed%60+' 秒'}};
 try{
  const healthResponse=await fetch('/api/health',{cache:'no-store'});
  if(!healthResponse.ok)throw Error('当前是静态页面，请启动用户之声本地研究服务后再提交');
  let health;try{health=await healthResponse.json()}catch{throw Error('当前页面未连接研究后端，请启动本地研究服务')}
  if(!health.available)throw Error('本机Codex CLI尚未就绪，无法执行真实采集');
  const response=await fetch('/api/research',{method:'POST',headers:{'Content-Type':'application/json','X-Research-Token':health.token},body:JSON.stringify({topic})});
  const job=await response.json();if(!response.ok)throw Error(job.error||'任务提交失败');
  researchStartedAt=Date.now();updateResearchTime();researchClock=setInterval(updateResearchTime,1000);researchStatus.textContent='已提交主题，正在采集与分析…';
  const poll=async()=>{
   try{
    const r=await fetch('/api/research/'+encodeURIComponent(job.id),{cache:'no-store'});const state=await r.json();
    if(!r.ok)throw Error(state.error||'无法获取任务进度');
    if(state.created_at){researchStartedAt=state.created_at*1000;updateResearchTime()}
    if(state.status==='completed'||state.status==='empty'){
     researchStatus.textContent=state.message+(state.counts?' · 相关反馈 '+state.counts.related+' 条':'');
     const link=document.createElement('a');link.href=state.url;link.textContent='查看本次研究结果 ↗';researchStatus.append(link);finish();return;
    }
    if(state.status==='failed')throw Error(state.message||'采集未完成');
    researchStatus.textContent=state.message||'研究任务进行中…';setTimeout(poll,3000);
   }catch(error){researchStatus.textContent=error.message||'连接中断，请检查本地服务';finish()}
  };setTimeout(poll,1500);
 }catch(error){researchStatus.textContent=error.message||'连接失败，请检查本地研究服务';finish()}
});

render();
</script></body></html>
